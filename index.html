<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#00cd3c">

  <title>YouTube → Melon</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f7f7f7;
      color: #171717;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Apple SD Gothic Neo",
        "Noto Sans KR",
        sans-serif;
    }

    .wrap {
      width: min(680px, calc(100% - 32px));
      margin: auto;
      padding: 60px 0;
    }

    .logo {
      width: 55px;
      height: 55px;
      border-radius: 17px;
      background: #00cd3c;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 29px;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0;
      font-size: 34px;
      letter-spacing: -1.5px;
    }

    .sub {
      margin-top: 12px;
      color: #777;
      line-height: 1.6;
    }

    .box {
      margin-top: 30px;
      background: white;
      border: 1px solid #e5e5e5;
      border-radius: 18px;
      padding: 8px;
      display: flex;
      gap: 8px;
      box-shadow: 0 8px 30px rgba(0,0,0,.04);
    }

    input {
      flex: 1;
      min-width: 0;
      border: 0;
      outline: 0;
      padding: 15px;
      font-size: 15px;
      background: transparent;
    }

    button {
      border: 0;
      cursor: pointer;
      font-weight: 700;
    }

    .mainBtn {
      background: #171717;
      color: white;
      border-radius: 13px;
      padding: 0 20px;
    }

    .mainBtn:disabled {
      opacity: .5;
    }

    .status {
      margin-top: 18px;
      color: #777;
      display: none;
    }

    .error {
      margin-top: 18px;
      padding: 15px;
      border-radius: 12px;
      background: #fff0f0;
      color: #d33;
      display: none;
    }

    .result {
      margin-top: 35px;
      display: none;
    }

    .result h2 {
      margin-bottom: 5px;
    }

    .count {
      color: #888;
      margin-bottom: 15px;
    }

    .tracks {
      background: white;
      border-radius: 18px;
      border: 1px solid #e5e5e5;
      overflow: hidden;
    }

    .track {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px;
      border-bottom: 1px solid #eee;
    }

    .track:last-child {
      border-bottom: 0;
    }

    .num {
      width: 28px;
      color: #aaa;
      font-size: 12px;
    }

    .info {
      flex: 1;
      min-width: 0;
    }

    .title {
      font-weight: 700;
    }

    .artist {
      color: #888;
      font-size: 13px;
      margin-top: 3px;
    }

    .melon {
      margin-top: 16px;
      width: 100%;
      padding: 17px;
      border-radius: 15px;
      background: #00cd3c;
      color: white;
      font-size: 16px;
    }

    .melon:disabled {
      opacity: .6;
    }

    @media(max-width:600px) {
      .wrap {
        padding-top: 40px;
      }

      h1 {
        font-size: 29px;
      }

      .box {
        flex-direction: column;
      }

      .mainBtn {
        height: 50px;
      }
    }
  </style>
</head>

<body>

<div class="wrap">

  <div class="logo">🍈</div>

  <h1>YouTube → Melon</h1>

  <div class="sub">
    YouTube 음악 모음 영상이나 플레이리스트의
    링크를 입력하면 곡 목록을 자동으로 추출합니다.
  </div>

  <div class="box">

    <input
      id="url"
      type="url"
      placeholder="YouTube 링크를 붙여넣으세요"
    >

    <button
      class="mainBtn"
      onclick="analyze()"
    >
      플레이리스트 만들기
    </button>

  </div>

  <div id="status" class="status">
    YouTube 영상을 분석하고 있습니다...
  </div>

  <div id="error" class="error"></div>

  <div id="result" class="result">

    <h2>추출된 곡</h2>

    <div id="count" class="count"></div>

    <div id="tracks" class="tracks"></div>

    <button
      id="melonButton"
      class="melon"
      onclick="openMelon()"
    >
      🍈 멜론에서 전체 재생
    </button>

  </div>

</div>

<script>

let tracks = [];


async function analyze() {

  const url =
    document.getElementById("url").value.trim();

  const status =
    document.getElementById("status");

  const error =
    document.getElementById("error");

  const result =
    document.getElementById("result");

  if (!url) {
    showError("YouTube 링크를 입력해주세요.");
    return;
  }

  if (
    !url.includes("youtube.com") &&
    !url.includes("youtu.be")
  ) {
    showError("YouTube 링크만 입력해주세요.");
    return;
  }

  error.style.display = "none";
  result.style.display = "none";
  status.style.display = "block";

  try {

    const response =
      await fetch("/api/analyze", {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          url: url
        })

      });

    const data =
      await response.json();

    if (!response.ok) {
      throw new Error(
        data.error || "분석에 실패했습니다."
      );
    }

    tracks = data.tracks || [];

    if (tracks.length === 0) {
      throw new Error(
        "추출된 곡이 없습니다."
      );
    }

    displayTracks();

    result.style.display = "block";

  } catch (e) {

    showError(
      e.message || "오류가 발생했습니다."
    );

  } finally {

    status.style.display = "none";

  }
}


function displayTracks() {

  const container =
    document.getElementById("tracks");

  const count =
    document.getElementById("count");

  container.innerHTML = "";

  count.textContent =
    `총 ${tracks.length}곡`;

  tracks.forEach((track, index) => {

    const div =
      document.createElement("div");

    div.className = "track";

    div.innerHTML = `

      <div class="num">
        ${String(index + 1).padStart(2,"0")}
      </div>

      <div class="info">

        <div class="title">
          ${escapeHTML(track.title)}
        </div>

        <div class="artist">
          ${escapeHTML(track.artist || "아티스트 미확인")}
        </div>

      </div>

    `;

    container.appendChild(div);

  });
}


function escapeHTML(text) {

  return String(text)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


function showError(message) {

  const error =
    document.getElementById("error");

  error.textContent = message;

  error.style.display = "block";

}


/*
  YouTube에서 추출한 곡을
  Melon에서 검색하고 Melon songId를 가져온다.
*/
async function findMelonSong(track) {

  const response =
    await fetch("/api/melon-search", {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        title: track.title,
        artist: track.artist || ""
      })

    });

  const data =
    await response.json();

  if (!response.ok || !data.success || !data.songId) {
    throw new Error(
      data.error || "Melon 곡을 찾지 못했습니다."
    );
  }

  return data.songId;
}


/*
  전체 곡을 Melon에서 찾은 뒤
  iPhone Melon 앱으로 넘긴다.
*/
async function openMelon() {

  if (!tracks || tracks.length === 0) {

    alert(
      "먼저 YouTube 곡 목록을 추출해주세요."
    );

    return;
  }

  const button =
    document.getElementById("melonButton");

  button.disabled = true;

  button.textContent =
    "🍈 멜론에서 곡을 찾는 중...";


  const melonIds = [];

  const failed = [];


  try {

    /*
      곡을 하나씩 검색한다.
      동시에 너무 많은 요청을 보내지 않도록
      순차적으로 처리한다.
    */

    for (let i = 0; i < tracks.length; i++) {

      const track = tracks[i];

      button.textContent =
        `🍈 멜론 곡 찾는 중... ${i + 1}/${tracks.length}`;

      try {

        const songId =
          await findMelonSong(track);

        if (songId) {

          melonIds.push(songId);

        } else {

          failed.push(track);

        }

      } catch (error) {

        console.error(
          "Melon 검색 실패:",
          track,
          error
        );

        failed.push(track);

      }

    }


    /*
      아무 곡도 찾지 못한 경우
    */

    if (melonIds.length === 0) {

      alert(
        "Melon에서 일치하는 곡을 찾지 못했습니다."
      );

      return;
    }


    /*
      iPhone Melon 앱 딥링크 생성
    */

    const melonUrl =
      "meloniphone://play/?ctype=1&menuid=0&cid=" +
      melonIds.join(",");


    /*
      Melon 앱 실행
    */

    window.location.href =
      melonUrl;


    /*
      찾지 못한 곡이 있다면
      잠시 후 알려준다.
    */

    if (failed.length > 0) {

      setTimeout(() => {

        alert(
          `Melon에서 ${melonIds.length}곡을 찾았습니다.\n` +
          `${failed.length}곡은 찾지 못했습니다.`
        );

      }, 1500);

    }

  } catch (error) {

    console.error(error);

    alert(
      "Melon 연결 중 오류가 발생했습니다."
    );

  } finally {

    button.disabled = false;

    button.textContent =
      "🍈 멜론에서 전체 재생";

  }

}

</script>

</body>
</html>
